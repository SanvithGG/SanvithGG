<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1e" />
      <stop offset="40%" stop-color="#0d1838" />
      <stop offset="75%" stop-color="#151b4b" />
      <stop offset="100%" stop-color="#080e24" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Dolphin Shading Gradients -->
    <linearGradient id="dolphinBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#60a5fa" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <linearGradient id="dolphinBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- High Fidelity Anatomical Dolphin -->
    <g id="dolphin">
      <!-- Ambient Bioluminescent Water Droplets Trail -->
      <g opacity="0.85">
        <circle cx="-75" cy="0" r="2.5" fill="#a5f3fc">
          <animate attributeName="r" values="2.5;0.6;2.5" dur="0.4s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.9;0.1;0.9" dur="0.4s" repeatCount="indefinite" />
        </circle>
        <circle cx="-88" cy="-5" r="1.8" fill="#67e8f9">
          <animate attributeName="r" values="1.8;0.3;1.8" dur="0.5s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.8;0.1;0.8" dur="0.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="-98" cy="4" r="2.2" fill="#38bdf8">
          <animate attributeName="r" values="2.2;0.4;2.2" dur="0.45s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.7;0;0.7" dur="0.45s" repeatCount="indefinite" />
        </circle>
        <circle cx="-110" cy="-2" r="1.5" fill="#e0f2fe">
          <animate attributeName="r" values="1.5;0.2;1.5" dur="0.35s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.6;0;0.6" dur="0.35s" repeatCount="indefinite" />
        </circle>
      </g>

      <!-- Tail Flukes with Harmonic Motion -->
      <g transform="translate(-62, 0)">
        <path d="M 0,0 
                 C -10,-12 -18,-18 -26,-16 
                 C -22,-5 -16,-1 -11,0 
                 C -16,1 -22,5 -26,16 
                 C -18,18 -10,12 0,0 Z" 
              fill="#4f46e5">
          <animateTransform 
            attributeName="transform" 
            type="rotate" 
            values="-12 0 0; 12 0 0; -12 0 0" 
            dur="0.5s" 
            repeatCount="indefinite" />
        </path>
      </g>

      <!-- Main Dolphin Body Silhouette -->
      <path d="M 52,0 
               C 48,-2 43,-4 38,-5 
               C 32,-11 22,-16 8,-16 
               C -2,-16 -7,-16 -12,-16 
               C -14,-28 -18,-35 -24,-34 
               C -27,-25 -27,-18 -28,-14 
               C -42,-11 -52,-6 -62,0 
               C -52,5 -40,8 -24,8 
               C -8,8 6,7 20,5 
               C 32,3 42,1 48,1 
               C 50,0 51,0 52,0 Z" 
            fill="url(#dolphinBody)" />

      <!-- Underbelly Accent -->
      <path d="M 50,0 
               C 44,1 36,2 26,4 
               C 10,6 -6,7 -22,7 
               C -40,7 -52,4 -61,0 
               C -50,6 -36,8 -20,8 
               C -6,8 8,7 22,5 
               C 34,3 44,1 50,0 Z" 
            fill="url(#dolphinBelly)" />

      <!-- Pectoral Flipper -->
      <path d="M 4,4 
               C 7,12 6,24 -4,29 
               C -5,22 -3,14 0,5 Z" 
            fill="#38bdf8" />

      <!-- Snout highlight & Smile line -->
      <path d="M 51,0 C 46,0.5 40,0.5 35,0" fill="none" stroke="#60a5fa" stroke-width="0.8" />

      <!-- Eye -->
      <circle cx="28" cy="-6" r="2.2" fill="#0b132b" />
      <circle cx="29" cy="-6.8" r="0.8" fill="#ffffff" />
    </g>
  </defs>

  <style>
    @keyframes floatStars {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes waveMove1 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-425px); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(-425px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveMove3 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-425px); }
    }
    .star { animation: floatStars 3s ease-in-out infinite; }
    .wave1 { animation: waveMove1 14s linear infinite; }
    .wave2 { animation: waveMove2 9s linear infinite; }
    .wave3 { animation: waveMove3 6s linear infinite; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .subtitle-text {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background Box with Dark Neon Ocean Gradient -->
  <rect width="850" height="240" rx="14" fill="url(#bgGrad)" />

  <!-- Ambient Shimmering Stars -->
  <g opacity="0.65">
    <circle class="star" cx="100" cy="35" r="1.5" fill="#38bdf8" style="animation-delay: 0.2s;" />
    <circle class="star" cx="220" cy="60" r="1.2" fill="#818cf8" style="animation-delay: 1.1s;" />
    <circle class="star" cx="350" cy="30" r="1.8" fill="#e0f2fe" style="animation-delay: 0.7s;" />
    <circle class="star" cx="600" cy="45" r="1.5" fill="#38bdf8" style="animation-delay: 1.8s;" />
    <circle class="star" cx="720" cy="70" r="1.2" fill="#818cf8" style="animation-delay: 0.5s;" />
    <circle class="star" cx="780" cy="30" r="2" fill="#c7d2fe" style="animation-delay: 1.4s;" />
    <circle class="star" cx="70" cy="80" r="1" fill="#67e8f9" style="animation-delay: 2.1s;" />
    <circle class="star" cx="470" cy="25" r="1.5" fill="#93c5fd" style="animation-delay: 1.6s;" />
  </g>

  <!-- Header Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Title Glow -->
    <text x="425" y="75" class="title-text" font-size="42" fill="#6366f1" opacity="0.4" filter="url(#softGlow)">Sanvith Gowda</text>
    <text x="425" y="75" class="title-text" font-size="42" fill="#ffffff">Sanvith Gowda</text>
    
    <!-- Subtitle with Neon Accents -->
    <text x="425" y="105" class="subtitle-text" font-size="15" fill="#38bdf8">
      Full-Stack Web Developer <tspan fill="#818cf8">✦</tspan> Spring Boot <tspan fill="#818cf8">&amp;</tspan> React
    </text>
  </g>

  <!-- Deep Back Ocean Waves -->
  <g class="wave1">
    <path d="M 0,165 Q 106,145 212,165 T 425,165 T 637,165 T 850,165 T 1062,165 T 1275,165 L 1275,240 L 0,240 Z" fill="url(#waveGrad1)" />
  </g>

  <!-- Mid Ocean Waves -->
  <g class="wave2">
    <path d="M 0,180 Q 106,160 212,180 T 425,180 T 637,180 T 850,180 T 1062,180 T 1275,180 L 1275,240 L 0,240 Z" fill="url(#waveGrad2)" />
  </g>

  <!-- Dolphin Swimming and Leaping Over the Container Waves -->
  <g>
    <use href="#dolphin" />
    <animateMotion 
      path="M -120,200 
            C -30,200 30,70 150,70 
            C 250,70 300,205 420,205 
            C 530,205 580,65 690,65 
            C 790,65 840,200 960,200 
            C 1030,200 1080,80 1170,80" 
      dur="6s" 
      repeatCount="indefinite" 
      rotate="auto" />
  </g>

  <!-- Front Ocean Waves with Water Splash Crest -->
  <g class="wave3">
    <path d="M 0,195 Q 106,180 212,195 T 425,195 T 637,195 T 850,195 T 1062,195 T 1275,195 L 1275,240 L 0,240 Z" fill="url(#waveGrad3)" />
  </g>

  <!-- Froth / Foam Highlights on Front Wave -->
  <g class="wave3" opacity="0.65">
    <path d="M 0,195 Q 106,180 212,195 T 425,195 T 637,195 T 850,195 T 1062,195 T 1275,195" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 10" />
  </g>

  <!-- Sleek Glowing Container Border -->
  <rect width="850" height="240" rx="14" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />
</svg>